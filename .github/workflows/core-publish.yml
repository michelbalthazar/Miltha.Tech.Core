name: Core Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set package version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Miltha.Tech.Core.sln

      - name: Build
        run: dotnet build Miltha.Tech.Core.sln -c Release --no-restore

      - name: Test
        run: dotnet test Miltha.Tech.Core.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Miltha.Tech.Core.sln -c Release --no-build -p:Version=${{ env.PKG_VERSION }} -o ./artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/michelbalthazar/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate