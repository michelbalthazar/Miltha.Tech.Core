name: Core CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Miltha.Tech.Core.sln

      - name: Build
        run: dotnet build Miltha.Tech.Core.sln -c Release --no-restore

      - name: Test
        run: dotnet test Miltha.Tech.Core.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Miltha.Tech.Core.sln -c Release --no-build -o ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg